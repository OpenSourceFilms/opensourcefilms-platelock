name: PlateLock synthetic registration visual evidence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/synthetic-registration-demo.yml"
      - "platelock/geometry.py"
      - "examples/synthetic_registration_demo.py"
      - "tests/test_synthetic_registration_demo.py"
  pull_request:
    paths:
      - ".github/workflows/synthetic-registration-demo.yml"
      - "platelock/geometry.py"
      - "examples/synthetic_registration_demo.py"
      - "tests/test_synthetic_registration_demo.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  known-transform-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout public source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install only synthetic geometry dependencies
        run: python -m pip install "numpy==2.2.6" "opencv-python-headless==4.11.0.86"
      - name: Test actual published PlateLock backward map
        run: python -B -m unittest discover -s tests -p "test_synthetic_registration_demo.py" -v
      - name: Render local evidence without downloading models
        run: python -B examples/synthetic_registration_demo.py --out "/tmp/platelock-registration-synthetic.png"
